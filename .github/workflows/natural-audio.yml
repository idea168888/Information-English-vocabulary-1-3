name: Upgrade English pronunciation
on:
  push:
    paths:
      - 'scripts/generate-natural-audio.py'
      - '.github/workflows/natural-audio.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: natural-audio
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install speech generator
        run: |
          python -m pip install gTTS==2.5.4
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate and validate all recordings
        run: python scripts/generate-natural-audio.py
      - name: Save upgraded recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio index.html
          git diff --cached --quiet || git commit -m "Replace mechanical voice with natural US English recordings"
          git push
